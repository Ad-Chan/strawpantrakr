<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>STRAWPANTRAKR ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    font-size: 16px;
  }
  body {
    background: #FFD6E8;
    font-family: 'VT323', monospace;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    display: flex;
    flex-direction: column;
  }

  /* ── scrollbar ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #FFB3D1; }
  ::-webkit-scrollbar-thumb { background: #FF2D78; border-radius: 2px; }

  /* ── bg glow ── */
  .y2k-bg {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }
  .y2k-bg::before {
    content: '';
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,45,120,0.18) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(177,79,255,0.15) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(0,229,255,0.07) 0%, transparent 60%);
  }

  /* ── decorative stars ── */
  .star {
    position: absolute; pointer-events: none; font-size: 13px;
    animation: twinkle 2.2s ease-in-out infinite; color: #FF2D78; z-index: 0;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.18; transform: scale(0.8) rotate(0deg); }
    50%      { opacity: 1;    transform: scale(1.2) rotate(180deg); }
  }

  /* ── marquee ── */
  .marquee-wrap { overflow: hidden; white-space: nowrap; }
  .marquee { display: inline-block; animation: scroll-left 20s linear infinite; }
  @keyframes scroll-left {
    from { transform: translateX(100vw); }
    to   { transform: translateX(-100%); }
  }

  /* ── shimmer title ── */
  .shimmer {
    background: linear-gradient(90deg, #FF2D78, #FF80B4, #B14FFF, #FF2D78);
    background-size: 200%;
    animation: shimmer 2.4s linear infinite;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  @keyframes shimmer { from { background-position: 0% } to { background-position: 200% } }

  /* ── card ── */
  .card {
    background: rgba(255,255,255,0.68);
    border: 2px solid #FF2D78;
    box-shadow: 4px 4px 0 #FF2D78, 7px 7px 0 rgba(255,45,120,0.18);
    backdrop-filter: blur(8px);
  }

  /* ── buttons ── */
  .btn {
    cursor: pointer; border: 2px solid #FF2D78;
    font-family: 'VT323', monospace; font-size: 18px; letter-spacing: 2px;
    transition: all 0.1s; text-transform: uppercase;
    box-shadow: 3px 3px 0 #FF2D78; background: white; color: #FF2D78;
    padding: 6px 16px; line-height: 1.2;
    -webkit-appearance: none; appearance: none;
    min-height: 44px; /* touch target */
  }
  .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #FF2D78; }
  .btn.primary { background: #FF2D78; color: white; }
  .btn.active  { background: #FF2D78; color: white; }

  .nav-btn {
    cursor: pointer; background: #FF2D78; border: 2px solid #CC0055;
    color: white; font-size: 22px; font-family: 'VT323',monospace;
    min-width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    box-shadow: 3px 3px 0 #CC0055; transition: all 0.1s;
    -webkit-appearance: none; appearance: none;
  }
  .nav-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #CC0055; }

  /* ── day cell ── */
  .day-cell {
    cursor: pointer; transition: background 0.1s; border: 2px solid transparent;
    min-height: 44px; display: flex; flex-direction: column; align-items: center; padding: 4px 2px 3px;
    -webkit-tap-highlight-color: transparent;
  }
  .day-cell:active { background: rgba(255,45,120,0.15) !important; }

  /* ── task row ── */
  .task-row { animation: popIn 0.18s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }

  /* ── stamp picker ── */
  .stamp-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    max-height: 180px; overflow-y: auto; padding: 4px;
  }
  .stamp-opt {
    font-size: 22px; text-align: center; cursor: pointer; padding: 4px 2px;
    border: 2px solid transparent; border-radius: 4px; transition: all 0.1s;
    min-height: 40px; display: flex; align-items: center; justify-content: center;
  }
  .stamp-opt:active, .stamp-opt.chosen { border-color: #FF2D78; background: #FFE0EE; }

  /* ── bottom nav (mobile) ── */
  .bottom-nav {
    flex-shrink: 0;
    left: 0; right: 0; z-index: 100;
    background: rgba(255,255,255,0.95); border-top: 2px solid #FF2D78;
    display: flex; backdrop-filter: blur(10px);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .bottom-nav-btn {
    flex: 1; cursor: pointer; background: none; border: none;
    font-family: 'VT323',monospace; font-size: 13px; letter-spacing: 1px;
    color: #CC0055; padding: 10px 4px 8px; display: flex; flex-direction: column;
    align-items: center; gap: 2px; transition: background 0.1s;
    min-height: 56px;
  }
  .bottom-nav-btn.active { background: #FFE0EE; color: #FF2D78; }
  .bottom-nav-btn span.icon { font-size: 20px; line-height: 1; }

  /* ── stats task list ── */
  .stats-task-row {
    display: flex; align-items: center; gap: 10; padding: 10px 14px;
    border-bottom: 1px dashed #FFB3D1;
  }

  /* ── progress bar ── */
  .pbar-fill { transition: width 0.5s cubic-bezier(.4,0,.2,1); }
  .bfill { transition: height 0.5s cubic-bezier(.4,0,.2,1); }

  /* ── transition animations ── */
  @keyframes slideInRight  { from { opacity:0; transform:translateX(40px);  } to { opacity:1; transform:translateX(0); } }
  @keyframes slideInLeft   { from { opacity:0; transform:translateX(-40px); } to { opacity:1; transform:translateX(0); } }
  @keyframes slideInUp     { from { opacity:0; transform:translateY(18px);  } to { opacity:1; transform:translateY(0); } }
  @keyframes slideOutLeft  { from { opacity:1; transform:translateX(0);     } to { opacity:0; transform:translateX(-40px); } }
  @keyframes slideOutRight { from { opacity:1; transform:translateX(0);     } to { opacity:0; transform:translateX(40px); } }
  @keyframes fadeOut       { from { opacity:1; } to { opacity:0; } }

  .anim-in-right  { animation: slideInRight  0.22s cubic-bezier(.25,.46,.45,.94) both; }
  .anim-in-left   { animation: slideInLeft   0.22s cubic-bezier(.25,.46,.45,.94) both; }
  .anim-in-up     { animation: slideInUp     0.2s  cubic-bezier(.25,.46,.45,.94) both; }
  .anim-out-left  { animation: slideOutLeft  0.15s cubic-bezier(.55,0,1,.45)     both; pointer-events:none; }
  .anim-out-right { animation: slideOutRight 0.15s cubic-bezier(.55,0,1,.45)     both; pointer-events:none; }
  .anim-out-fade  { animation: fadeOut       0.12s ease                          both; pointer-events:none; }

  /* ── panda celebration ── */
  @keyframes pandaPop {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(0.3) rotate(-15deg); }
    40%  { opacity:1; transform:translate(-50%,-50%) scale(1.3) rotate(8deg); }
    65%  { transform:translate(-50%,-50%) scale(0.95) rotate(-4deg); }
    80%  { transform:translate(-50%,-50%) scale(1.08) rotate(2deg); }
    100% { opacity:0; transform:translate(-50%,-50%) scale(1.1) rotate(0deg); }
  }
  .panda-burst {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size:36px; line-height:1;
    pointer-events:none; z-index:50;
    animation: pandaPop 0.9s cubic-bezier(.36,.07,.19,.97) forwards;
    white-space:nowrap;
  }
  .modal-bg {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(255,45,120,0.18); backdrop-filter: blur(4px);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal-sheet {
    background: #FFF0F6; border: 2px solid #FF2D78; border-bottom: none;
    box-shadow: 0 -4px 0 #FF2D78;
    width: 100%; max-width: 520px;
    padding: 18px 16px 0;
    border-radius: 0;
    max-height: 80dvh; overflow-y: auto;
    padding-bottom: env(safe-area-inset-bottom, 16px);
  }

  /* ── task history modal ── */
  @keyframes sheetUp   { from { transform:translateY(100%); opacity:0; } to { transform:translateY(0);    opacity:1; } }
  @keyframes sheetDown { from { transform:translateY(0);    opacity:1; } to { transform:translateY(100%); opacity:0; } }
  .history-sheet {
    background:#FFF0F6; border:2px solid #FF2D78; border-bottom:none;
    box-shadow:0 -4px 0 #FF2D78;
    width:100%; max-width:520px;
    padding:18px 16px 0;
    max-height:75dvh; display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom,16px);
    animation: sheetUp 0.25s cubic-bezier(.25,.46,.45,.94) both;
  }
  .history-sheet.closing { animation: sheetDown 0.2s cubic-bezier(.55,0,1,.45) both; }
  .history-list { overflow-y:auto; flex:1; margin-top:10px; -webkit-overflow-scrolling:touch; }
  .history-row {
    display:flex; align-items:center; gap:10px;
    padding:10px 0; border-bottom:1px dashed #FFB3D1;
  }
  .history-row:last-child { border-bottom:none; }

  /* ── form inputs ── */
  input, select, textarea {
    -webkit-appearance: none; appearance: none; outline: none;
    font-family: 'VT323', monospace;
    border-radius: 0;
  }
  input:focus { border-color: #FF2D78 !important; }

  /* ── content offset for bottom nav ── */
  .content-pad { padding: 12px 0 24px; }

  /* ── responsive grid ── */
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }

  @media (min-width: 640px) {
    .stamp-grid { grid-template-columns: repeat(10,1fr); }
  }
</style>
</head>
<body>

<div class="y2k-bg">
  <!-- Stars -->
  <div class="star" style="top:7%;left:4%;animation-delay:0s">✦</div>
  <div class="star" style="top:14%;left:93%;animation-delay:0.6s">✦</div>

  <div class="star" style="top:30%;left:97%;animation-delay:1.7s">✦</div>

  <!-- Ticker -->
  <div style="background:#FF2D78;padding:5px 0;border-bottom:2px solid #CC0055;overflow:hidden;position:relative;z-index:10;">
    <div class="marquee-wrap">
      <span class="marquee" style="font-size:13px;color:white;letter-spacing:3px;">
        ✦ STRAWPANTRAKR ✦ YOUR DAILY TASK MANAGER ✦ STAY PRODUCTIVE ✦ XOXO ✦ STRAWPANTRAKR ✦ YOUR DAILY TASK MANAGER ✦ STAY PRODUCTIVE ✦ XOXO ✦
      </span>
    </div>

  <!-- Header -->
  <div style="padding:10px 16px 10px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:10;flex-wrap:wrap;gap:8px;border-bottom:3px solid #FF2D78;box-shadow:0 3px 0 rgba(255,45,120,0.15);background:rgba(255,214,232,0.95);backdrop-filter:blur(6px);">
    <div>
      <div class="shimmer" style="font-family:'Orbitron',monospace;font-size:28px;font-weight:900;letter-spacing:2px;">STRAWPANTRAKR</div>
      <div style="font-size:14px;color:#FF2D78;letter-spacing:3px;margin-top:-4px;">✦ ngo oi lei leng lui ✦</div>

  <!-- Main content area -->
  <div id="app-content" style="position:relative;z-index:5;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 0px 10px;"></div>

  <!-- Bottom navigation -->
  <nav class="bottom-nav">
    <button class="bottom-nav-btn active" id="nav-calendar" onclick="switchView('calendar')">

    <button class="bottom-nav-btn" id="nav-day" onclick="switchView('day')">

  <div class="modal-sheet">

    <!-- Tab strip -->
    <div style="display:flex;gap:8px;margin-bottom:14px;">

    <div id="modal-panel-new">

      <input id="new-task-input" type="text" placeholder="WHAT 2 DO..." inputmode="text"
        style="width:100%;background:white;border:2px solid #FFB3D1;padding:10px 12px;font-size:20px;color:#CC0055;margin-bottom:10px;box-shadow:2px 2px 0 #FFB3D1;">
      <div style="font-size:14px;color:#FF2D78;letter-spacing:2px;margin-bottom:6px;">✦ PICK A STAMP</div>

      <div style="font-size:13px;color:#FFB3D1;letter-spacing:1px;margin-top:4px;margin-bottom:10px;">
        selected: <span id="stamp-preview" style="font-size:22px;vertical-align:middle;">⭐</span>

      <div id="saved-task-list" style="max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;margin-bottom:12px;"></div>

<!-- Task History Modal -->
<div class="modal-bg" id="history-modal" style="display:none;" onclick="closeHistoryBg(event)">
  <div class="history-sheet" id="history-sheet">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;">
      <div>
        <div style="font-size:13px;color:#FF2D78;letter-spacing:3px;">✦ TASK HISTORY</div>
        <div id="history-title" style="font-size:20px;color:#CC0055;margin-top:2px;"></div>
      </div>
      <button class="btn" onclick="closeHistory()" style="padding:4px 12px;font-size:16px;flex-shrink:0;">✕ CLOSE</button>
    </div>
    <div id="history-summary" style="margin-top:8px;font-size:14px;color:#FF2D78;flex-shrink:0;"></div>
    <div class="history-list" id="history-list"></div>
    <div style="padding:12px 0;flex-shrink:0;"></div>
  </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const DAYS   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const DEFAULT_STAMPS = [
  "🐼", "🍓", "⭐","🔥","💪","📚","🎯","✅","🏃","🧘","💊","🍎",
  "💻","📝","🎨","🎵","🌟","💡","🚀","❤️","😊","🌈",
  "🧹","🛒","💰","🏋️","🤝","📞","✍️","🍳","🚿","😴",
  "🐾","🌺","☕","🎉","🏆","💎","🌙","⚡","🎮","🧩",
  "📧","🗓️","🔑","🎁","🌍","🧪","🎓","🏠","🚗","✈️",
];

let STAMPS = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem('strawpantrakr-stamps'));
    return Array.isArray(saved) && saved.length ? saved : [...DEFAULT_STAMPS];
  } catch { return [...DEFAULT_STAMPS]; }
})();

function saveStamps() { localStorage.setItem('strawpantrakr-stamps', JSON.stringify(STAMPS)); }

// ── Saved tasks ────────────────────────────────────────────────────────────
let SAVED_TASKS = (() => {
  try {
    const s = JSON.parse(localStorage.getItem('strawpantrakr-saved') || '[]');
    return Array.isArray(s) ? s : [];
  } catch { return []; }
})();
function saveSavedTasks() { localStorage.setItem('strawpantrakr-saved', JSON.stringify(SAVED_TASKS)); }

const DAYS_IN_MONTH = (y,m) => new Date(y,m+1,0).getDate();
const FIRST_DOW     = (y,m) => new Date(y,m,1).getDay();
const DATE_KEY      = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

// ── State ──────────────────────────────────────────────────────────────────
const now  = new Date();
let state = {
  view: 'calendar',
  year:  now.getFullYear(),
  month: now.getMonth(),
  selectedDate: DATE_KEY(now.getFullYear(), now.getMonth(), now.getDate()),
  tasks: {},
  newStamp: '⭐',
};

try { state.tasks = JSON.parse(localStorage.getItem('strawpantrakr-tasks') || '{}'); } catch {}

const TODAY_KEY = DATE_KEY(now.getFullYear(), now.getMonth(), now.getDate());

function save() { localStorage.setItem('strawpantrakr-tasks', JSON.stringify(state.tasks)); }
function dayTasks(key) { return state.tasks[key] || []; }

// ── Streak ─────────────────────────────────────────────────────────────────
function getStreak() {
  let s = 0, d = new Date();
  while (true) {
    const k = DATE_KEY(d.getFullYear(), d.getMonth(), d.getDate());
    const t = state.tasks[k] || [];
    if (!t.length || !t.every(x => x.done)) break;
    s++; d.setDate(d.getDate()-1);
  }
  return s;
}

// ── Month stats ────────────────────────────────────────────────────────────
function monthStats(y, m) {
  let total=0, done=0;
  for (let d=1; d<=DAYS_IN_MONTH(y,m); d++) {
    const t = dayTasks(DATE_KEY(y,m,d));
    total += t.length; done += t.filter(x=>x.done).length;
  }
  return {total,done};
}

// ── Task CRUD ──────────────────────────────────────────────────────────────
function addTask() {
  const input = document.getElementById('new-task-input');
  const text  = input.value.trim();
  if (!text) return;

  // Edit mode — update existing task
  if (_editingTask) {
    const { dateKey, taskId } = _editingTask;
    state.tasks[dateKey] = (state.tasks[dateKey] || []).map(t =>
      t.id === taskId ? { ...t, text, stamp: stampRef(state.newStamp) } : t
    );
    save(); closeModal(); render();
    return;
  }

  // Add mode — create new task
  const task = { id: Date.now(), text, done: false, stamp: stampRef(state.newStamp) };
  state.tasks[state.selectedDate] = [...(state.tasks[state.selectedDate]||[]), task];
  save(); closeModal(); render();
}

function toggleTask(dateKey, id) {
  const task = (state.tasks[dateKey]||[]).find(t => t.id===id);
  const markingDone = task && !task.done;

  if (markingDone) {
    // Find the task row element and inject the burst before re-rendering
    const row = document.querySelector(`[data-task-id="${id}"]`);
    if (row) {
      const burst = document.createElement('div');
      burst.className = 'panda-burst';
      burst.textContent = '🐼👍';
      row.style.position = 'relative';
      row.appendChild(burst);
      // Re-render after animation completes
      setTimeout(() => {
        state.tasks[dateKey] = (state.tasks[dateKey]||[]).map(t => t.id===id ? {...t, done:true} : t);
        save(); render();
      }, 500);
      return;
    }
  }

  state.tasks[dateKey] = (state.tasks[dateKey]||[]).map(t => t.id===id ? {...t, done:!t.done} : t);
  save(); render();
}

function deleteTask(dateKey, id) {
  state.tasks[dateKey] = (state.tasks[dateKey]||[]).filter(t => t.id!==id);
  save(); render();
}

// ── Navigation ─────────────────────────────────────────────────────────────

// Tab order for determining slide direction between views
const TAB_ORDER = ['calendar', 'day', 'stats', 'settings'];

function animateContent(outClass, inClass, updateFn) {
  const el = document.getElementById('app-content');
  // Slide out
  el.classList.add(outClass);
  setTimeout(() => {
    el.classList.remove(outClass);
    updateFn();               // swap content
    el.scrollTop = 0;         // reset scroll position
    el.classList.add(inClass);
    setTimeout(() => el.classList.remove(inClass), 250);
  }, 150);
}

function switchView(v) {
  const oldIdx = TAB_ORDER.indexOf(state.view);
  const newIdx = TAB_ORDER.indexOf(v);
  const goingRight = newIdx > oldIdx;

  state.view = v;
  document.querySelectorAll('.bottom-nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-'+v).classList.add('active');

  animateContent(

// Renders an SVG heart that fills bottom-up based on fraction (0–1).
// size: pixel width/height of the square SVG.
// fillColor: filled portion color. outlineColor: the empty outline.
function heartSVG(fraction, size, fillColor, outlineColor) {
  fraction = Math.max(0, Math.min(1, fraction));
  const id = 'hc' + Math.random().toString(36).slice(2,8);
  // Heart path defined in a 100×90 viewBox.
  // Fills from bottom (y=90) upward by (1-fraction)*90.
  const clipY = (1 - fraction) * 90;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 95" xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible;">
    <defs>
      <clipPath id="${id}">
        <rect x="0" y="${clipY}" width="100" height="${90 - clipY}"/>
      </clipPath>
    </defs>
    <!-- outline heart (always visible) -->
    <path d="M50 85 C50 85 10 55 10 30 C10 16 20 8 30 8 C38 8 46 13 50 20 C54 13 62 8 70 8 C80 8 90 16 90 30 C90 55 50 85 50 85 Z"
      fill="none" stroke="${outlineColor}" stroke-width="3" stroke-linejoin="round"/>
    <!-- filled heart clipped from bottom -->
    <path d="M50 85 C50 85 10 55 10 30 C10 16 20 8 30 8 C38 8 46 13 50 20 C54 13 62 8 70 8 C80 8 90 16 90 30 C90 55 50 85 50 85 Z"
      fill="${fillColor}" clip-path="url(#${id})"/>
  </svg>`;
}

// ── Stamp display helper ───────────────────────────────────────────────────

// Resolve a stamp value stored on a task to its full object (for image stamps).
// Tasks store image stamps as their id string ("img_1234") — look up from STAMPS.
function resolveStamp(stamp) {
  if (!stamp) return '⭐';
  // Already a full image object (legacy / in-memory)
  if (typeof stamp === 'object' && stamp.type === 'image') return stamp;
  // Id reference string — look up in STAMPS registry
  if (typeof stamp === 'string' && stamp.startsWith('img_')) {
    return STAMPS.find(s => typeof s === 'object' && s.id === stamp) || '🖼️';
  }
  return stamp;
}

// Returns an HTML string for a stamp — either emoji text or an <img>.
// size: css size string e.g. '22px', '11px'
function stampDisplay(stamp, size) {
  const resolved = resolveStamp(stamp);
  if (typeof resolved === 'object' && resolved.type === 'image') {
    return `<img src="${resolved.dataUrl}" alt="${escHtml(resolved.label||'')}"
      style="width:${size};height:${size};object-fit:cover;border-radius:2px;display:block;flex-shrink:0;" loading="lazy">`;
  }
  const s = typeof resolved === 'string' ? resolved : '⭐';
  return `<span style="font-size:${size};line-height:1;display:inline-block;">${s}</span>`;
}

// Returns a stable string key for a stamp (for dedup / comparison)
function stampKey(stamp) {
  const resolved = resolveStamp(stamp);
  if (typeof resolved === 'object' && resolved.type === 'image') return 'img:' + resolved.id;
  return typeof resolved === 'string' ? resolved : '⭐';
}

// Converts a stamp to the compact form stored on task records:
// emoji → emoji string, image object → its id string
function stampRef(stamp) {
  if (!stamp) return '⭐';
  if (typeof stamp === 'object' && stamp.type === 'image') return stamp.id;
  return stamp;
}

function renderStats() {
  // Build per-task-name aggregation across all days
  const taskMap = {}; // stampKey+text => {stamp, text, total, done}
  Object.values(state.tasks).forEach(arr => {
    (arr||[]).forEach(t => {
      const sk  = stampKey(t.stamp||'⭐');
      const key = sk + '|' + t.text.toLowerCase().trim();
      if (!taskMap[key]) taskMap[key] = {stamp: t.stamp||'⭐', text: t.text, total:0, done:0};
      taskMap[key].total++;
      if (t.done) taskMap[key].done++;
    });
  });
  const taskList = Object.values(taskMap).sort((a,b)=>b.total-a.total);

  // Last 7 days
  const last7 = Array.from({length:7},(_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-(6-i));
    const k = DATE_KEY(d.getFullYear(),d.getMonth(),d.getDate());
    const t = dayTasks(k);
    return {label:DAYS[d.getDay()],total:t.length,done:t.filter(x=>x.done).length,key:k};
  });

  let totalAll=0,doneAll=0,activeDays=0,perfectDays=0;
  Object.values(state.tasks).forEach(arr=>{
    if(arr?.length){activeDays++;totalAll+=arr.length;doneAll+=arr.filter(x=>x.done).length;if(arr.every(x=>x.done))perfectDays++;}
  });

  const maxBar = Math.max(...last7.map(x=>x.total),1);

  return `
    <div style="padding:0 12px;" class="content-pad">

      <!-- 7-day hearts -->
      <div class="card" style="padding:14px;margin-bottom:14px;">
        <div style="font-size:13px;color:#FF2D78;letter-spacing:3px;margin-bottom:4px;">✦ LAST 7 DAYS</div>

        <div style="display:flex;align-items:flex-end;gap:4px;">
          ${last7.map(({label,total,done,key})=>{
            const fraction = total ? done/total : 0;

// ── Task History Modal ─────────────────────────────────────────────────────
function openTaskHistoryByIdx(idx) {
  const t = (window._statsTaskList || [])[idx];
  if (!t) return;
  openTaskHistoryForTask(t.stamp, t.text);
}

function openTaskHistory(stampEscaped, textEscaped) {
  // Legacy path (emoji stamps passed as attribute strings)
  const stamp = stampEscaped;
  const text  = textEscaped.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
  openTaskHistoryForTask(stamp, text);
}

function openTaskHistoryForTask(stamp, text) {
  const mapKey = stampKey(stamp) + '|' + text.toLowerCase().trim();

  // Gather every instance across all dates
  const instances = [];
  Object.entries(state.tasks).forEach(([dateKey, arr]) => {
    (arr||[]).forEach(t => {
      const k = stampKey(t.stamp||'⭐') + '|' + t.text.toLowerCase().trim();
      if (k === mapKey) instances.push({ dateKey, done: t.done });
    });
  });
  // Sort newest first
  instances.sort((a,b) => b.dateKey.localeCompare(a.dateKey));

  const totalDone = instances.filter(x=>x.done).length;

  const titleEl = document.getElementById('history-title');
  titleEl.innerHTML = `<span style="display:inline-flex;align-items:center;gap:6px;vertical-align:middle;">
    ${stampDisplay(stamp,'20px')} ${escHtml(text)}
  </span>`;
  document.getElementById('history-summary').textContent =
    `${totalDone} of ${instances.length} completed  ·  ${instances.length ? Math.round(totalDone/instances.length*100) : 0}% rate`;

  document.getElementById('history-list').innerHTML = instances.length === 0
    ? `<div style="text-align:center;color:#FFB3D1;font-size:18px;padding:24px 0;">No history yet!</div>`
    : instances.map(({dateKey, done}) => {
        const d = new Date(dateKey + 'T12:00:00');
        const label = d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
        return `
          <div class="history-row">
            <div style="width:22px;height:22px;flex-shrink:0;
              background:${done?'#FF2D78':'white'};
              border:2px solid #FF2D78;
              display:flex;align-items:center;justify-content:center;
              font-size:13px;color:white;font-weight:700;">
              ${done?'✓':''}
            </div>
            <span style="flex:1;font-size:17px;color:${done?'#CC0055':'#FFB3D1'};
              text-decoration:${done?'none':'line-through'};">${label}</span>
            <span style="font-size:13px;font-family:'Orbitron',monospace;font-weight:700;
              color:${done?'#FF2D78':'#FFB3D1'};">${done?'DONE':'MISS'}</span>
          </div>`;
      }).join('');

  const modal = document.getElementById('history-modal');
  const sheet = document.getElementById('history-sheet');
  sheet.classList.remove('closing');
  modal.style.display = 'flex';
}

function closeHistory() {
  const sheet = document.getElementById('history-sheet');
  sheet.classList.add('closing');
  setTimeout(() => {
    document.getElementById('history-modal').style.display = 'none';
    sheet.classList.remove('closing');
  }, 200);
}

function closeHistoryBg(e) {
  if (e.target.id === 'history-modal') closeHistory();
}
function render() {
  const el = document.getElementById('app-content');
  let html='';
  if (state.view==='calendar') html=renderCalendar();
  else if (state.view==='day')  html=renderDay();
  else if (state.view==='stats') html=renderStats();
  else if (state.view==='settings') html=renderSettings();
  el.innerHTML = html;

// ── Settings: Export ───────────────────────────────────────────────────────
function exportData() {
  // Sanitise task records: image stamps stored as full objects (legacy) → id string
  const cleanTasks = {};
  for (const [date, arr] of Object.entries(state.tasks)) {
    cleanTasks[date] = (arr || []).map(t => ({
      ...t,
      stamp: stampRef(t.stamp),
    }));
  }
  // Sanitise saved tasks the same way
  const cleanSaved = SAVED_TASKS.map(t => ({ ...t, stamp: stampRef(t.stamp) }));

  const payload = {
    version: 2,
    exportedAt: new Date().toISOString(),
    tasks: cleanTasks,
    stamps: STAMPS,        // full image registry (dataUrls live here only)
    savedTasks: cleanSaved,
  };
  const json   = JSON.stringify(payload, null, 2);
  const blob   = new Blob([json], { type: 'text/plain;charset=utf-8' });
  const url    = URL.createObjectURL(blob);
  const date   = new Date().toISOString().slice(0,10);
  const a      = document.createElement('a');
  a.href       = url;
  a.download   = `strawpantrakr-backup-${date}.txt`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  showSettingsMsg('✦ backup downloaded!', '#6EE7B7');
}

// ── Settings: Import ───────────────────────────────────────────────────────
function triggerImport() {
  document.getElementById('import-file-input').click();
}

function handleImport(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const payload = JSON.parse(e.target.result);
      if (!payload.tasks || typeof payload.tasks !== 'object') throw new Error('bad format');
      const dayCount  = Object.keys(payload.tasks).length;
      const taskCount = Object.values(payload.tasks).reduce((s,a)=>s+a.length,0);
      if (!confirm(`Import ${taskCount} tasks across ${dayCount} days?\n\nThis will REPLACE all current data.`)) {
        input.value = '';
        return;
      }
      state.tasks = payload.tasks;
      // Migrate v1: task.stamp may be a full image object — flatten to id ref
      for (const arr of Object.values(state.tasks)) {
        for (const t of (arr || [])) {
          if (typeof t.stamp === 'object' && t.stamp?.type === 'image') {
            t.stamp = t.stamp.id || '⭐';
          }
        }
      }
      save();
      if (Array.isArray(payload.stamps) && payload.stamps.length) {
        STAMPS.length = 0;
        payload.stamps.forEach(s => STAMPS.push(s));
        saveStamps();
      }
      if (Array.isArray(payload.savedTasks)) {
        SAVED_TASKS.length = 0;
        payload.savedTasks.forEach(t => SAVED_TASKS.push(t));
        saveSavedTasks();
      }
      input.value = '';
      showSettingsMsg(`✦ imported ${taskCount} tasks across ${dayCount} days!`, '#FF2D78');
      render();
    } catch {
      input.value = '';
      showSettingsMsg('✕ invalid file — please use a strawpantrakr backup .txt', '#FF4444');
    }
  };
  reader.readAsText(file);
}

function showSettingsMsg(msg, color) {
  const el = document.getElementById('settings-msg');
  if (!el) return;
  el.textContent = msg;
  el.style.color = color;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 3000);
}

// ── Settings: Stamp management ─────────────────────────────────────────────
function addStampFromInput() {
  const input = document.getElementById('new-stamp-input');
  const raw   = input.value.trim();
  if (!raw) return;
  const segs  = [...new Intl.Segmenter().segment(raw)];
  const stamp = segs[0]?.segment || raw[0];
  if (STAMPS.some(s => stampKey(s) === stampKey(stamp))) {
    showSettingsMsg('✦ stamp already exists!', '#FFB3D1');
    input.value = '';
    return;
  }
  STAMPS.push(stamp);
  saveStamps();
  input.value = '';
  render();
}

function triggerImageStamp() {
  document.getElementById('stamp-image-input').click();
}

function handleImageStamp(input) {
  const file = input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    showSettingsMsg('✕ please choose an image file', '#FF4444');
    input.value = '';
    return;
  }
  const label = file.name.replace(/\.[^.]+$/, '').slice(0, 24);
  const reader = new FileReader();
  reader.onload = (e) => {
    // Resize to max 64px to keep localStorage usage small
    const img = new Image();
    img.onload = () => {
      const MAX = 64;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width  = Math.round(img.width  * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/png');
      const id = 'img_' + Date.now();
      const stamp = { type: 'image', id, dataUrl, label };
      STAMPS.push(stamp);
      saveStamps();
      input.value = '';
      render();
      showSettingsMsg(`✦ "${label}" added!`, '#FF2D78');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function deleteStamp(idx) {
  const stamp = STAMPS[idx];
  if (stamp === undefined) return;
  const label = typeof stamp === 'object' ? (stamp.label || 'image') : stamp;
  const inUse = Object.values(state.tasks).some(arr => arr.some(t => stampKey(t.stamp) === stampKey(stamp)));
  const msg = inUse
    ? `"${label}" is used by existing tasks. Remove it from the stamp picker anyway?`
    : `Remove "${label}" from the stamp picker?`;
  if (!confirm(msg)) return;
  STAMPS.splice(idx, 1);
  if (stampKey(state.newStamp) === stampKey(stamp)) state.newStamp = STAMPS[0] || '⭐';
  saveStamps();
  render();
}

function resetStamps() {
  if (!confirm('Reset stamps to the default set? Your custom stamps will be removed.')) return;
  STAMPS.length = 0;
  DEFAULT_STAMPS.forEach(s => STAMPS.push(s));
  saveStamps();
  render();
}

          <div style="margin-top:8px;color:#FFB3D1;font-size:13px;">
            ✦ Back up regularly to avoid losing data ✦
          </div>
        </div>
      </div>

      <!-- Status message -->
      <div id="settings-msg" style="text-align:center;font-size:16px;letter-spacing:2px;min-height:24px;transition:opacity 0.6s;opacity:0;padding:4px 0;"></div>
    </div>`;
}

// ── Init ───────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key==='Enter') {
    if (document.activeElement?.id === 'saved-task-text-input') { commitSavedTask(); return; }
    if (document.getElementById('add-modal').style.display!=='none') addTask();
  }
  if (e.key==='Escape') {
    closeModal();
    if (document.getElementById('history-modal').style.display!=='none') closeHistory();
  }
});
render();
const el = document.getElementById('app-content');
el.classList.add('anim-in-up');
setTimeout(() => el.classList.remove('anim-in-up'), 250);
</script>
</body>
</html>
